# Lucy Edge — runnable local config (S25 Ultra)
#
# PHONE-ONLY, ON-DEVICE design.  Inference runs locally on the device using the
# from-scratch TinyTransformer trained by `python3 -m training.train` — never a
# public cloud and never a remote LLM.  `mock` remains available as the safe
# fallback.  Ollama / external LLM inference is intentionally out of scope here.
#
# The `training` section points at a REAL checkpoint produced by
# `python3 -m training.train` (from-scratch, stdlib-only). Introspection reports
# MODEL_WEIGHT_TRAINING as AVAILABLE only because this checkpoint + DONE lineage
# run exist locally — never fabricated.

default_provider: local_lucy

phone:
  phone_local_inference_enabled: true
  local_inference_unlocked: true

routing:
  # Strict sovereign default: the synthetic "NEXUS SAFE" mock provider is
  # opt-in only, never registered by default.  Real local inference or nothing.
  allow_mock_generation: false

training:
  checkpoint_path: training/checkpoints/latest.json
  lineage_db: training/lineage.db

mcp:
  enabled: false
